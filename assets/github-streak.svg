<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="GitHub Contribution Streak">
<style>
  .title { fill: #58a6ff; font: 600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .label { fill: #8b949e; font: 400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .value { fill: #c9d1d9; font: 600 23px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .small { fill: #8b949e; font: 400 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
</style>
<rect width="419" height="199" x="0.5" y="0.5" rx="6" fill="#0d1117" stroke="#30363d"/>
<text x="22" y="32" class="title">GitHub Contribution Streak</text>
<line x1="140" y1="57" x2="140" y2="168" stroke="#30363d"/>
<line x1="280" y1="57" x2="280" y2="168" stroke="#30363d"/>
<text x="70" y="94" text-anchor="middle" class="value">11</text>
<text x="70" y="119" text-anchor="middle" class="label">Current streak</text>
<text x="70" y="145" text-anchor="middle" class="small">Aug 13 - Aug 23, 2026</text>
<text x="210" y="94" text-anchor="middle" class="value">11</text>
<text x="210" y="119" text-anchor="middle" class="label">Longest streak</text>
<text x="210" y="145" text-anchor="middle" class="small">Aug 13 - Aug 23, 2026</text>
<text x="350" y="94" text-anchor="middle" class="value">554</text>
<text x="350" y="119" text-anchor="middle" class="label">Contributions</text>
<text x="350" y="145" text-anchor="middle" class="small">Last 12 months</text>
<text x="210" y="184" text-anchor="middle" class="small">Generated from the public contribution calendar</text>
</svg>
